{% extends 'base.html' %}
{% block content %}
<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}
    
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">
                <i class="fas fa-credit-card"></i> Cardholders
            </h1>
            
            <div class="card-glass mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="dateRange" class="text-white">Rango de Fechas</label>
                                <input type="text" class="form-control" id="dateRange">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="status" class="text-white">Estado</label>
                                <select class="form-control" id="status">
                                    <option value="all">Todos</option>
                                    <option value="active">Activos</option>
                                    <option value="inactive">Inactivos</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button class="btn-glass mt-3">
                        <i class="fas fa-download"></i> Descargar Reporte
                    </button>
                </div>
            </div>

            <div class="card-glass">
                <div class="card-body">
                    <table class="table table-glass">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th>Fecha de Registro</th>
                                <th>Última Actividad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los datos se cargarán dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    $(document).ready(function() {
        $('#dateRange').daterangepicker({
            opens: 'left',
            locale: {
                format: 'DD/MM/YYYY'
            }
        });
    });
</script>
{% endblock %}
{% endblock %}
