{% extends 'base.html' %}
{% block content %}
<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}
    
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">Query Manager</h1>
            
            <div class="mb-4">
                <a href="{% url 'query_create' %}" class="btn-glass">
                    <i class="fas fa-plus"></i> Nueva Query
                </a>
            </div>

            <div class="card-glass">
                <div class="card-body">
                    <table class="table table-glass">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for query in queries %}
                            <tr>
                                <td>{{ query.title }}</td>
                                <td>{{ query.description }}</td>
                                <td>
                                    <div class="btn-group">
                                        <a href="{% url 'query_edit' query.id %}" class="btn-glass btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a href="{% url 'query_delete' query.id %}" class="btn-glass btn-sm text-danger">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
