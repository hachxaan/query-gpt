<!-- Sidebar -->
<div class="bg-light border-right" id="sidebar-wrapper">
    <style>
        #sidebar-wrapper {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 100vh;
            position: sticky;
            top: 0;
            height: 100vh;
            width: 300px !important; /* Aumentado de ~150px a 300px */
            overflow-y: auto;
        }

        .sidebar-heading {
            color: white;
            font-size: 1.2rem;
            padding: 1.5rem 1rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .list-group-item-action {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 0.5rem;
            color: white !important;
            transition: all 0.3s ease;
            padding: 1rem 1.5rem; /* Aumentado el padding horizontal */
            font-size: 1.1rem; /* Aumentado el tamaño de fuente */
        }

        /* ... resto de los estilos ... */

        /* Ajustes responsivos */
        @media (max-width: 768px) {
            #sidebar-wrapper {
                position: fixed;
                z-index: 1000;
                width: 300px !important; /* Mantenemos el mismo ancho en móvil */
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }

            /* ... resto de los media queries ... */
        }
    </style>
    <div class="sidebar-heading">Menú</div>
    <div class="list-group list-group-flush">
        <!-- Usar la variable current_path para aplicar la clase active -->
        <a href="{% url 'home' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'home' %}active{% else %}bg-light{% endif %}">Home</a>
        <a href="{% url 'query_list_download' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'query_list_download' %}active{% else %}bg-light{% endif %}">Download Queries</a>
        <a href="{% url 'query_list' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'query_list' %}active{% else %}bg-light{% endif %}">Queries Manager</a>
        <a href="{% url 'audiences' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'audiences' %}active{% else %}bg-light{% endif %}">Audiences</a>
        <!-- Banking dropdown -->
        <div class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'banking' or request.resolver_match.url_name == 'cardholders' %}active{% else %}bg-light{% endif %}" data-bs-toggle="collapse" href="#bankingSubmenu" role="button" aria-expanded="false" aria-controls="bankingSubmenu">
            Banking
        </div>
        <div class="collapse {% if request.resolver_match.url_name == 'banking' or request.resolver_match.url_name == 'cardholders' %}show{% endif %}" id="bankingSubmenu">
            <a href="{% url 'banking' %}" class="list-group-item list-group-item-action ps-4 {% if request.resolver_match.url_name == 'banking' %}active{% else %}bg-light{% endif %}">Banking Reports</a>
            <a href="{% url 'cardholders' %}" class="list-group-item list-group-item-action ps-4 {% if request.resolver_match.url_name == 'cardholders' %}active{% else %}bg-light{% endif %}">Cardholders</a>
        </div>
    </div>
</div>
<!-- /#sidebar-wrapper -->
