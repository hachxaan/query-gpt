{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    body {
        background: linear-gradient(45deg, #1a2980, #26d0ce);
        background-attachment: fixed;
        color: white;
    }

    #wrapper {
        background: transparent;
    }

    .container-fluid {
        padding: 2rem;
        max-width: 100%;
        background: transparent !important;
    }

    .page-title {
        font-size: 2rem;
        margin-bottom: 2rem;
        font-weight: 700;
        text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .queries-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* OPCIÓN PREDETERMINADA (RECOMENDADA) */
    }

    .query-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .query-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
    }

    .query-card-header {
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
    }

    .query-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .query-description {
        font-size: 1rem;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.8);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .query-card-footer {
        padding: 1.25rem;
        background: rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: flex-end;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .download-button {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        border-radius: 6px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .download-button:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    .download-icon {
        font-size: 1rem;
    }
</style>

<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}

    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">Marketing Queries</h1>

            <div class="queries-grid">
                {% for query in queries %}
                <div class="query-card">
                    <div class="query-card-header">
                        <h2 class="query-title">{{ query.title }}</h2>
                        <p class="query-description">{{ query.description }}</p>
                    </div>
                    <div class="query-card-footer">
                        <a href="{% url 'download_results' query.id %}" class="download-button">
                            <i class="fas fa-download download-icon"></i>
                            <span>Descargar</span>
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
