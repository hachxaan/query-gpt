{% extends 'base.html' %}
{% block content %}
<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}
    
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">Marketing Queries</h1>
            
            <div class="queries-grid">
                {% for query in queries %}
                <div class="card-glass">
                    <div class="query-card-header">
                        <h2 class="query-title">{{ query.title }}</h2>
                        <p class="query-description">{{ query.description }}</p>
                    </div>
                    <div class="query-card-footer">
                        <a href="{% url 'download_results' query.id %}" class="btn-glass">
                            <i class="fas fa-download"></i>
                            <span>Descargar</span>
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
