{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .background {
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        background: linear-gradient(45deg, #3a34b3, #0696b4);
        z-index: -1;
    }

    .shapes {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 25%),
                    radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.4) 0%, transparent 25%);
    }

    #wrapper {
        background: transparent;
    }

    #page-content-wrapper {
        background: transparent;
    }

    .container-fluid {
        padding: 2rem;
    }

    .page-title {
        color: white;
        font-size: 2.5rem;
        margin-bottom: 2rem;
        text-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        font-weight: 700;
    }

    .queries-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
        padding: 1rem;
    }

    .query-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .query-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .query-card-header {
        padding: 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .query-title {
        color: white;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .query-description {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.95rem;
        line-height: 1.5;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    .query-card-footer {
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        background: rgba(255, 255, 255, 0.1);
    }

    .download-button {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        color: white;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
    }

    .download-button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
    }

    .download-icon {
        color: white;
        font-size: 1.2rem;
    }

    @media (max-width: 768px) {
        .container-fluid {
            padding: 1rem;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        .queries-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
    }
</style>

<div class="background">
    <div class="shapes"></div>
</div>

<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}

    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">Marketing Queries</h1>

            <div class="queries-grid">
                {% for query in queries %}
                <div class="query-card">
                    <div class="query-card-header">
                        <h2 class="query-title">{{ query.title }}</h2>
                        <p class="query-description">{{ query.description }}</p>
                    </div>
                    <div class="query-card-footer">
                        <a href="{% url 'download_results' query.id %}" class="download-button">
                            <i class="fas fa-download download-icon"></i>
                            <span>Descargar</span>
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
