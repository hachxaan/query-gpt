{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
    }

    #wrapper {
        background: transparent;
    }

    #page-content-wrapper {
        background: transparent;
    }

    .container-fluid {
        padding: 1.5rem;
    }

    .page-title {
        color: #ffffff;
        font-size: 2rem;
        margin-bottom: 1.5rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .queries-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1.25rem;
    }

    .query-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
    }

    .query-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        background: rgba(255, 255, 255, 0.15);
    }

    .query-card-header {
        padding: 1rem;
        background: rgba(0, 0, 0, 0.2);
    }

    .query-title {
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .query-description {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
        line-height: 1.4;
        margin-bottom: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .query-card-footer {
        padding: 0.75rem;
        background: rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: flex-end;
    }

    .download-button {
        background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        transition: all 0.3s ease;
    }

    .download-button:hover {
        background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
        color: white;
        text-decoration: none;
        transform: translateY(-1px);
    }

    .download-icon {
        font-size: 1rem;
    }

    @media (max-width: 1200px) {
        .queries-grid {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
    }

    @media (max-width: 768px) {
        .container-fluid {
            padding: 1rem;
        }

        .queries-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .page-title {
            font-size: 1.75rem;
        }
    }

    @media (max-width: 576px) {
        .queries-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="d-flex" id="wrapper">
    {% include 'queries/menu-querys.html' %}

    <div id="page-content-wrapper">
        <div class="container-fluid">
            <h1 class="page-title">Marketing Queries</h1>

            <div class="queries-grid">
                {% for query in queries %}
                <div class="query-card">
                    <div class="query-card-header">
                        <h2 class="query-title">{{ query.title }}</h2>
                        <p class="query-description">{{ query.description }}</p>
                    </div>
                    <div class="query-card-footer">
                        <a href="{% url 'download_results' query.id %}" class="download-button">
                            <i class="fas fa-download download-icon"></i>
                            <span>Descargar</span>
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
