{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            /* Oscurecemos un poco el gradiente para mejor contraste */
            background: linear-gradient(45deg, #3a34b3, #0696b4);
            z-index: -1;
        }

        .shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Aumentamos la opacidad de los círculos */
            background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 25%),
                        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.4) 0%, transparent 25%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .main-title {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            /* Aumentamos la sombra para mejor legibilidad */
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
            font-weight: 700;
        }

        .glass-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .glass-card {
            /* Aumentamos la opacidad del fondo */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* Borde más visible */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 0.5rem;
            transition: all 0.3s ease;
            overflow: hidden;
            /* Añadimos sombra base */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            /* Fondo más claro al hover */
            background: rgba(255, 255, 255, 0.2);
            /* Sombra más pronunciada al hover */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-content {
            text-decoration: none;
            display: block;
            height: 100%;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            /* Añadimos sombra al texto */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .card-text {
            /* Aumentamos la opacidad del texto */
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            line-height: 1.5;
            /* Añadimos sombra sutil al texto */
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .main-title {
                font-size: 2rem;
                margin-bottom: 2rem;
            }

            .glass-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="shapes"></div>
    </div>
    
    <main class="container">
        <h1 class="main-title">Panel de Control</h1>
        <div class="glass-grid">
            <div class="glass-card">
                <a href="{% url 'query_list_download' %}" class="card-content">
                    <div class="card-body">
                        <h3 class="card-title">Query Builder</h3>
                        <p class="card-text">
                            Natural language query builder
                        </p>
                    </div>
                </a>
            </div>

            <div class="glass-card">
                <a href="{% url 'mailing_campaign_list' %}" class="card-content">
                    <div class="card-body">
                        <h3 class="card-title">Campaign HTML Builder</h3>
                        <p class="card-text">
                            Create the HTML for the campaigns from a CSV file.
                        </p>
                    </div>
                </a>
            </div>

            <div class="glass-card">
                <a href="{% url 'dashboard_builder_app:home' %}" class="card-content">
                    <div class="card-body">
                        <h3 class="card-title">Dashboard Builder</h3>
                        <p class="card-text">
                            Create intuitive and powerful dashboards powered by artificial intelligence.
                        </p>
                    </div>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
